        'Unified LLM layer integrating 7 AI providers',

    {
      id: 'minneapolis',

      lng: -93.2650,

      role: 'BS Aerospace Engineering & Mechanics',
      desc: 'Earned BS in Aerospace Engineering & Mechanics. Recognized as a 2024 University of Minnesota On The Rise Alumni Leader.',
      highlights: [

        '2024 On The Rise Alumni Leader Award'
      ],
      link: null
    },
    {
      id: 'singapore',
      lat: 1.3521,
      lng: 103.8198,
      city: 'Singapore',
      country: 'Singapore',
      org: 'Micron Technology · GE Power',
      role: 'Water Infrastructure Engineer',
      desc: 'Commissioned ultra-pure water treatment systems for Micron\'s semiconductor fabrication facility — critical infrastructure for chip manufacturing at scale.',
      highlights: [

        'GE Power infrastructure across three continents'
      ],

        'International space governance & policy'
      ],
      link: null

  function formatCoords(lat, lng) {
    const latDir = lat >= 0 ? 'N' : 'S';
    const lngDir = lng >= 0 ? 'E' : 'W';
    return `${Math.abs(lat).toFixed(1)}°${latDir}  ${Math.abs(lng).toFixed(1)}°${lngDir}`;
  }

  const popoutEl   = document.getElementById('location-popout');
  const closeBtn   = document.getElementById('popout-close');

  function showPopout(loc) {
    document.getElementById('popout-coords').textContent = formatCoords(loc.lat, loc.lng);
    document.getElementById('popout-city').textContent   = `${loc.city} · ${loc.country}`;
    document.getElementById('popout-org').textContent    = loc.org;
    document.getElementById('popout-role').textContent   = loc.role;
    document.getElementById('popout-desc').textContent   = loc.desc;

    const bulletsEl = document.getElementById('popout-bullets');
    bulletsEl.innerHTML = loc.highlights.map(h => `<li>${h}</li>`).join('');

    const linkEl = document.getElementById('popout-link');
    if (loc.link) {
      linkEl.href          = loc.link;
      linkEl.textContent   = loc.link.label;
      linkEl.style.display = 'block';
    } else {
      linkEl.style.display = 'none';
    }

    popoutEl.classList.remove('hidden');
    popoutEl.setAttribute('aria-hidden', 'false');

    world.pointOfView({ lat: loc.lat, lng: loc.lng, altitude: 2.0 }, 1200);
  }

  function closePopout() {
    popoutEl.classList.add('hidden');
    popoutEl.setAttribute('aria-hidden', 'true');
  }

  closeBtn.addEventListener('click', closePopout);

  // Build globe
  const container = document.getElementById('globe-container');

  const world = Globe()(container)
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
    .atmosphereColor('#5A9FD4')
    .atmosphereAltitude(0.14)
    .htmlElementsData(LOCATIONS)
    .htmlAltitude(0.01)
    .htmlElement(d => {
      const el = document.createElement('div');
      el.className = 'globe-pin';
      el.setAttribute('title', d.city);
      el.innerHTML = `
        <div class="pin-marker">
          <div class="pin-pulse"></div>
          <div class="pin-dot"></div>
        </div>
        <div class="pin-label">${d.city}</div>
      `;
      el.addEventListener('click', e => {
        e.stopPropagation();
        showPopout(d);
      });
      return el;
    })
    .onGlobeClick(closePopout);

  world.onGlobeReady(() => {
    world.pointOfView({ lat: 25, lng: -20, altitude: 2.4 });

    const controls = world.controls();
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.4;
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.08;

    controls.addEventListener('start', () => {
      controls.autoRotate = false;
    });
  });

  window.addEventListener('resize', () => {
    world.width(container.offsetWidth).height(container.offsetHeight);
  });
</script>
